<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Stellar — Collection audio</title>
  <style>
    :root { color-scheme: dark; --text:#f4f6fb; --muted:#e0e5f2; --accent:#c5b8ff; }
    * { box-sizing: border-box; }
    html { min-height:100%; background:#0b1020; }
    body {
      position:relative; isolation:isolate;
      margin:0; min-height:100vh; color:var(--text);
      font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; padding:32px 16px;
      background:#0b1020;
    }
    /* Extension douce de la même photo pour remplir toute la largeur */
    body::before {
      content:""; position:fixed; inset:-18px; z-index:-2;
      background:url("/Stellar/54c95e9e-d925-4df4-9267-607f5f5e5cfd.png") center center / cover no-repeat;
      filter:blur(14px) brightness(.48); transform:scale(1.04);
    }
    /* Photo originale entière, sans recadrage, à gauche */
    body::after {
      content:""; position:fixed; z-index:-1; top:0; left:0; height:100vh;
      width:min(66.6667vh, 42vw);
      background:
        linear-gradient(rgba(5,8,18,.08), rgba(5,8,18,.20)),
        url("/Stellar/54c95e9e-d925-4df4-9267-607f5f5e5cfd.png") left top / 100% 100% no-repeat;
      box-shadow:12px 0 38px rgba(0,0,0,.18);
    }
    main { position:relative; z-index:1; width:min(760px, calc(100% - 16px)); margin-left:clamp(340px, 26vw, 620px); margin-right:16px; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:.78rem; font-weight:700; text-shadow:0 2px 8px #000; }
    h1 { margin:.25rem 0 .5rem; font-size:clamp(2rem,6vw,3.4rem); line-height:1.08; text-shadow:0 2px 16px #000; }
    .intro { color:var(--muted); margin:0 0 28px; text-shadow:0 2px 8px #000; }
    .track { background:rgba(13,19,36,.88); backdrop-filter:blur(8px); border:1px solid rgba(202,210,239,.24); border-radius:18px; padding:18px; margin:14px 0; box-shadow:0 10px 30px #0005; }
    .track-head { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
    .num { flex:none; width:42px; height:42px; display:grid; place-items:center; background:#292747; color:var(--accent); border-radius:13px; font-weight:800; }
    h2 { font-size:1.05rem; margin:0; }
    .sub { color:var(--muted); font-size:.85rem; }
    audio { display:block; width:100%; height:42px; }
    footer { color:var(--muted); font-size:.82rem; margin-top:28px; text-align:center; text-shadow:0 2px 8px #000; }
    @media (max-width:900px) {
      body { padding:24px 12px; }
      body::after { width:min(66.6667vh, 48vw); opacity:.82; }
      main { width:100%; max-width:760px; margin:0 auto; }
      .track { padding:15px; }
    }
    @media (max-width:520px) {
      body::after { width:100vw; height:58vh; opacity:.55; }
      body::before { filter:blur(10px) brightness(.38); }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Collection audio</div>
    <h1>Stellar</h1>
    <p class="intro">Écoute les six morceaux ci-dessous. Appuie sur lecture pour démarrer.</p>
    <section class="track"><div class="track-head"><div class="num">01</div><div><h2>Mundus Resurgit</h2><div class="sub">Piste 1</div></div></div><audio controls preload="none"><source src="audio/1%20Mundus_Resurgit.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <section class="track"><div class="track-head"><div class="num">02</div><div><h2>Pax In Aeternum</h2><div class="sub">Piste 2</div></div></div><audio controls preload="none"><source src="audio/2%20Pax_In_Aeternum.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <section class="track"><div class="track-head"><div class="num">03</div><div><h2>Lux In Tenebris</h2><div class="sub">Piste 3</div></div></div><audio controls preload="none"><source src="audio/3%20Lux_In_Tenebris.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <section class="track"><div class="track-head"><div class="num">04</div><div><h2>Vox Profunda</h2><div class="sub">Piste 4</div></div></div><audio controls preload="none"><source src="audio/4%20Vox_Profunda.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <section class="track"><div class="track-head"><div class="num">05</div><div><h2>Lux in Templum</h2><div class="sub">Piste 5</div></div></div><audio controls preload="none"><source src="audio/5%20Lux_in_Templum.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <section class="track"><div class="track-head"><div class="num">06</div><div><h2>Aeterna Lux</h2><div class="sub">Piste 6</div></div></div><audio controls preload="none"><source src="audio/6%20Aeterna_Lux.mp3" type="audio/mpeg">Ton navigateur ne prend pas en charge l'audio.</audio></section>
    <footer>Stellar · Collection audio</footer>
  </main>
</body>
</html>
